# RTX 3080 10GB - Llama-2-7B QLoRA (needs HF Llama-2 access)
# If OOM: drop max_seq_length to 512 or set per_device_train_batch_size: 1
model_name_or_path: meta-llama/Llama-2-7b-hf
output_dir: checkpoints/rtx3080-llama2-lora
dataset_path: data/processed/codealpaca_15k.jsonl
max_seq_length: 1024
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 10
save_steps: 200
seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

precision: fp16
gradient_checkpointing: true
use_packing: true
packing_efficiency_log: true
load_in_4bit: true

eval:
  humaneval_n: 164
  harness_n: 500
  max_new_tokens: 512
  temperature: 0.2
  top_p: 0.95
