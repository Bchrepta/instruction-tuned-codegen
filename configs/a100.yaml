# A100 40GB - Llama-2-7B, LoRA r=16/alpha=32, bf16, grad ckpt, seq 2048
model_name_or_path: meta-llama/Llama-2-7b-hf
output_dir: checkpoints/a100-lora
dataset_path: data/processed/codealpaca_15k.jsonl
max_seq_length: 2048
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 10
save_steps: 200
seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

precision: bf16
gradient_checkpointing: true
use_packing: true
packing_efficiency_log: true
load_in_4bit: false

eval:
  humaneval_n: 164
  harness_n: 500
  max_new_tokens: 512
  temperature: 0.2
  top_p: 0.95
