# RTX 3080 10GB - TinyLlama fp16 LoRA (no bitsandbytes needed)
# TinyLlama ~1.1B fits easily in 10GB. For Llama-2-7B on this card, use
# configs/rtx3080_llama2.yaml (needs bitsandbytes / usually WSL2).
model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
output_dir: checkpoints/rtx3080-lora
dataset_path: data/processed/codealpaca_15k.jsonl
max_seq_length: 1024
num_train_epochs: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 10
save_steps: 200
seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

precision: fp16
gradient_checkpointing: true
use_packing: true
packing_efficiency_log: true
load_in_4bit: false

eval:
  humaneval_n: 164
  harness_n: 500
  max_new_tokens: 256
  temperature: 0.2
  top_p: 0.95
