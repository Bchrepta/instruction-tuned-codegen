# Local CPU/GPU smoke - tiny random Llama (same arch as Llama-2, seconds to download)
# For a larger open smoke model, swap to: TinyLlama/TinyLlama-1.1B-Chat-v1.0
model_name_or_path: hf-internal-testing/tiny-random-LlamaForCausalLM
output_dir: checkpoints/smoke-lora
dataset_path: data/processed/codealpaca_smoke.jsonl
max_seq_length: 128
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 1
save_steps: 50
seed: 42
max_steps: 5

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

precision: fp32
gradient_checkpointing: true
use_packing: true
packing_efficiency_log: true
load_in_4bit: false

eval:
  humaneval_n: 5
  harness_n: 10
  max_new_tokens: 64
  temperature: 0.2
  top_p: 0.95
